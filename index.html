<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>전초선</title><link rel="stylesheet" href="style.css"></head>
<body><main><div class="arena"><canvas id="game" width="1200" height="720" aria-label="WASD 이동, 마우스 조준과 사격, R 장전"></canvas>
<div class="controls"><button id="pause" aria-label="일시정지" title="일시정지 (Esc)">Ⅱ</button><button id="settings" aria-label="설정" title="설정">⚙</button></div>
<div class="combat-hud"><div class="health" id="health-meter" role="progressbar" aria-label="체력" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><i id="health"></i></div><div class="ammo-block"><span id="ammo">12 / 12</span><div class="reload-track"><i id="reload-progress"></i></div></div></div>
<div id="story-caption" class="story-caption hidden" role="status" aria-live="polite"></div><section id="overlay" class="overlay"><div class="modal"><h1>전초선</h1><p>마지막 무전은 “후퇴하라”였다.<br>돌아온 건 나 하나였다.</p><div class="tutorial">WASD 이동 · E 기습 · 마우스 사격 · R 장전</div><button id="start" class="primary">작전 시작</button><small>프롤로그: 숨어 기다렸다가 수색병을 제압하고 소총을 빼앗으세요.<br>탄환 예상 경로는 우측 상단 설정에서 켤 수 있습니다.</small></div></section>
</div></main><script type="module" src="src/main.js"></script></body></html>
