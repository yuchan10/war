<!doctype html><html lang="ko"><meta charset="utf-8"><title>작전 지형 6개</title><style>body{background:#101913;color:#e3e3cf;font:16px system-ui;margin:24px}main{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}canvas{width:100%;display:block}h2{font-size:16px;margin:8px 0}p{color:#aeb8a4}</style><h1>작전 지형</h1><p>초록: 진입 · 붉은색: 적 배치 · 노란색: 출구. 실제 플레이에는 기존 시야 제한이 적용됩니다.</p><main></main><script type="module">
import {STAGES} from '../src/stages.js';import {drawTerrain} from '../src/terrain.js';import {Renderer} from '../src/renderer.js';
for(const [i,s] of STAGES.entries()){const box=document.createElement('section'),title=document.createElement('h2'),canvas=document.createElement('canvas');title.textContent=`${i+1}. ${s.name}`;canvas.width=1200;canvas.height=720;box.append(title,canvas);document.querySelector('main').append(box);const c=canvas.getContext('2d');drawTerrain(c,s);for(const wall of s.walls)Renderer.prototype.wall.call({},c,wall);for(const e of s.enemies){c.fillStyle='#ce8465';c.beginPath();c.arc(e.x,e.y,10,0,Math.PI*2);c.fill();}for(const [p,color]of [[s.spawn,'#b6d595'],[s.exit,'#efdc85']]){c.strokeStyle=color;c.lineWidth=5;c.beginPath();c.arc(p.x,p.y,20,0,Math.PI*2);c.stroke();}}
</script></html>
